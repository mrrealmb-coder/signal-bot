name: Дохио шалгах

# GitHub хуваарьт ажлыг олон удаа алгасдаг тул нэг ажил ~5.5 цаг тасралтгүй ажиллаж,
# 15 минут тутам (02, 17, 32, 47 минутад) шалгана. Дуусахдаа дараагийн ээлжийг өөрөө эхлүүлнэ.
# Ботыг зогсоох бол: Actions → Дохио шалгах → ⋯ → Disable workflow.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 15 минут тутам дохио шалгаж Telegram руу илгээх
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while :; do
            git pull -q --rebase origin main || true
            python signal_bot.py || true
            git add state.json || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Дохионы төлөв шинэчлэв"
              git pull -q --rebase origin main || true
              git push -q || true
            fi
            now=$(date +%s)
            next=$(( (now - 120) / 900 * 900 + 900 + 120 ))
            if [ "$next" -ge "$end" ]; then break; fi
            echo "Дараагийн шалгалт: $(TZ=Asia/Ulaanbaatar date -d @$next +%H:%M)"
            sleep $(( next - now ))
          done
          echo "Дараагийн ээлжийг эхлүүлж байна"
          gh workflow run signals.yml --ref main || true
