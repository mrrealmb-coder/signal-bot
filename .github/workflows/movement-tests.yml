name: Signal delivery and entry tests
on:
  push:
    branches: [main, codex/movement-watch-live, codex/entry-sl-tp, codex/order-flow-admission-20261119]
    paths: [signal_bot.py, auctionAdmission.mjs, auction_read.mjs, auction_admission.py, amd_confirmation.py, smc_frozen.py, movement_watch.py, entry_plans.py, entry_live.py, config.json, 'test_*.py', .github/workflows/movement-tests.yml]
  pull_request:
    paths: [signal_bot.py, auctionAdmission.mjs, auction_read.mjs, auction_admission.py, amd_confirmation.py, smc_frozen.py, movement_watch.py, entry_plans.py, entry_live.py, config.json, 'test_*.py', .github/workflows/movement-tests.yml]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -q
      - name: Verify the public PAXG signal feed from the runner
        run: |
          # Fixed liquid replay window so a naturally quiet minute cannot fail the connectivity check.
          cut=1795005900000
          node auction_read.mjs "$cut" 1 smc | tee /tmp/auction.json
          node -e "const d=require('/tmp/auction.json'); if (d.verdict === 'wait') process.exit(1)"
