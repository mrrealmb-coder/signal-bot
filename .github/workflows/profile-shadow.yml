name: Profile TP shadow observation
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['profile_shadow.py', 'test_profile_shadow.py', '.github/workflows/profile-shadow.yml']
permissions:
  contents: write
concurrency:
  group: profile-shadow
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shadow isolation and calculations
        run: python -m unittest test_profile_shadow
      - name: Observe new signals without sending messages
        id: observe
        continue-on-error: true
        run: python profile_shadow.py
      - name: Persist only shadow evidence
        run: |
          git config user.name 'profile-shadow'
          git config user.email 'profile-shadow@users.noreply.github.com'
          git add profile_shadow_state.json PROFILE_SHADOW_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update prospective Profile TP shadow evidence'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Surface observation errors
        if: steps.observe.outcome == 'failure'
        run: exit 1
